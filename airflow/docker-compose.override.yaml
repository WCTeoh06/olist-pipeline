services:
  warehouse-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data

  airflow-worker:
    volumes:
      - ../data/raw:/opt/airflow/data/raw:ro
    environment:
      AIRFLOW_CONN_WAREHOUSE: postgresql://warehouse:${WAREHOUSE_PASSWORD}@warehouse-db:5432/olist

volumes:
  warehouse-data:
